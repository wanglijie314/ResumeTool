<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>简历一键填</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header class="hd">
      <span class="logo">简</span>
      <div class="tt">
        <div class="t1">简历一键填</div>
        <div class="t2" id="copy-chip">默认副本：…</div>
      </div>
      <button id="btn-open-options" class="mini" type="button" title="打开完整管理页">完整管理…</button>
    </header>

    <nav class="tabs">
      <button data-view="fill" class="active" type="button">扫描并填写</button>
      <button data-view="manage" type="button">信息副本</button>
    </nav>

    <main>
      <section id="view-fill">
        <div class="statline">
          <span id="fill-status">准备中…</span>
          <button id="btn-rescan" class="mini" type="button">重新扫描</button>
        </div>
        <div id="rows" class="rows"></div>
        <div class="bar" id="bar-fill">
          <span class="hint" id="fill-hint"></span>
          <button id="btn-fill-rows" class="mini" type="button" hidden title="把默认副本的经历按顺序填进页面多行组合">按段填经历…</button>
          <button id="btn-teach" class="mini" type="button" hidden>教学未识别…</button>
          <button id="btn-fill" class="primary" type="button">填写</button>
        </div>
      </section>

      <section id="view-manage" hidden>
        <div class="statline"><span id="manage-status"></span></div>
        <div id="copy-list" class="rows"></div>
        <div class="bar">
          <button id="btn-new-copy" class="mini" type="button">＋ 新建副本</button>
          <button id="btn-copy-options" class="mini" type="button">在完整页面编辑内容…</button>
        </div>
      </section>
    </main>

    <div id="msg" class="msg" hidden></div>
  </body>
</html>
